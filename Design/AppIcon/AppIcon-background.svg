<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <title>CableScope — background layer</title>
  <desc>Edge-to-edge square. Drag into Icon Composer as the background layer, or skip this file and pick an equivalent gradient preset in the canvas inspector.</desc>
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3143E0"/>
      <stop offset="0.55" stop-color="#1D2CA8"/>
      <stop offset="1" stop-color="#0B1044"/>
    </linearGradient>
    <radialGradient id="bg-sheen" cx="0.28" cy="0.16" r="0.65">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.62" stop-color="#060B2B" stop-opacity="0"/>
      <stop offset="1" stop-color="#060B2B" stop-opacity="0.34"/>
    </radialGradient>
  </defs>
  <g id="background">
    <rect width="1024" height="1024" fill="url(#bg-gradient)"/>
    <rect width="1024" height="1024" fill="url(#bg-sheen)"/>
    <rect width="1024" height="1024" fill="url(#bg-vignette)"/>
  </g>
</svg>
