<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <title>CableScope — foreground layer</title>
  <desc>Drag into Icon Composer as a foreground layer group. Flat, opaque strokes; no baked shadows or highlights.</desc>
  <defs>
    <linearGradient id="arc-gradient" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#8BEFFF"/>
      <stop offset="0.45" stop-color="#4FC2FF"/>
      <stop offset="1" stop-color="#2F7BF0"/>
    </linearGradient>
  </defs>
  <g id="foreground">
    <!-- Rating-gauge arc: 140° sweep (radius 300, pivot at the port's center 512,619.5),
         hand-written as two cubic Béziers instead of an SVG arc ("A") command — Icon
         Composer's SVG importer does not resolve elliptical arcs and silently flattens
         them into a straight chord between the endpoints. -->
    <path d="M 230.1 516.9 C 273.23 398.39, 385.88 319.5, 512 319.5
             C 638.12 319.5, 750.77 398.39, 793.9 516.9"
          fill="none" stroke="url(#arc-gradient)"
          stroke-width="48" stroke-linecap="round"/>
    <!-- USB-C port, sitting at the arc's pivot -->
    <rect x="352" y="534.5" width="320" height="170" rx="85"
          fill="none" stroke="#FFFFFF" stroke-width="40"/>
  </g>
</svg>
