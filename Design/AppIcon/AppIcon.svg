<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <title>CableScope App Icon</title>
  <desc>A USB-C port sitting at the pivot of an open rating-gauge arc. macOS 26 Liquid Glass layered source: background / middle / foreground groups. The rounded-rect mask is applied by the system and is intentionally not baked in.</desc>

  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3143E0"/>
      <stop offset="0.55" stop-color="#1D2CA8"/>
      <stop offset="1" stop-color="#0B1044"/>
    </linearGradient>
    <radialGradient id="bg-sheen" cx="0.28" cy="0.16" r="0.65">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.62" stop-color="#060B2B" stop-opacity="0"/>
      <stop offset="1" stop-color="#060B2B" stop-opacity="0.34"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#52CBFF" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#52CBFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#52CBFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc-gradient" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#8BEFFF"/>
      <stop offset="0.45" stop-color="#4FC2FF"/>
      <stop offset="1" stop-color="#2F7BF0"/>
    </linearGradient>
  </defs>

  <!-- BACKGROUND LAYER — edge-to-edge, system masks it into the rounded rectangle -->
  <g id="background">
    <rect width="1024" height="1024" fill="url(#bg-gradient)"/>
    <rect width="1024" height="1024" fill="url(#bg-sheen)"/>
    <rect width="1024" height="1024" fill="url(#bg-vignette)"/>
  </g>

  <!-- MIDDLE LAYER — soft electric halo centered on the arc's pivot, gives the mark parallax depth in Icon Composer -->
  <g id="middle">
    <circle cx="512" cy="619.5" r="340" fill="url(#halo)"/>
  </g>

  <!-- FOREGROUND LAYER — flat vector mark: rating-gauge arc + USB-C port at its pivot.
       Glass (specular / translucency / shadow) is added by Icon Composer, not baked in. -->
  <g id="foreground">
    <!-- Rating-gauge arc: 140° sweep (radius 300, pivot at the port's center 512,619.5),
         hand-written as two cubic Béziers instead of an SVG arc ("A") command — Icon
         Composer's SVG importer does not resolve elliptical arcs and silently flattens
         them into a straight chord between the endpoints. -->
    <path d="M 230.1 516.9 C 273.23 398.39, 385.88 319.5, 512 319.5
             C 638.12 319.5, 750.77 398.39, 793.9 516.9"
          fill="none" stroke="url(#arc-gradient)"
          stroke-width="48" stroke-linecap="round"/>
    <!-- USB-C port, sitting at the arc's pivot -->
    <rect x="352" y="534.5" width="320" height="170" rx="85"
          fill="none" stroke="#FFFFFF" stroke-width="40"/>
  </g>
</svg>
