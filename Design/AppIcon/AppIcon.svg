<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <title>CableScope App Icon</title>
  <desc>Coiled cable ring pierced by an oscilloscope pulse. macOS 26 Liquid Glass layered source: background / middle / foreground groups. The rounded-rect mask is applied by the system and is intentionally not baked in.</desc>

  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3143E0"/>
      <stop offset="0.55" stop-color="#1D2CA8"/>
      <stop offset="1" stop-color="#0B1044"/>
    </linearGradient>
    <radialGradient id="bg-sheen" cx="0.28" cy="0.16" r="0.65">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.62" stop-color="#060B2B" stop-opacity="0"/>
      <stop offset="1" stop-color="#060B2B" stop-opacity="0.34"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#52CBFF" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#52CBFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#52CBFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cable-gradient" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#8BEFFF"/>
      <stop offset="0.45" stop-color="#4FC2FF"/>
      <stop offset="1" stop-color="#2F7BF0"/>
    </linearGradient>
  </defs>

  <!-- BACKGROUND LAYER — edge-to-edge, system masks it into the rounded rectangle -->
  <g id="background">
    <rect width="1024" height="1024" fill="url(#bg-gradient)"/>
    <rect width="1024" height="1024" fill="url(#bg-sheen)"/>
    <rect width="1024" height="1024" fill="url(#bg-vignette)"/>
  </g>

  <!-- MIDDLE LAYER — soft electric halo, gives the mark parallax depth in Icon Composer -->
  <g id="middle">
    <circle cx="512" cy="512" r="350" fill="url(#halo)"/>
  </g>

  <!-- FOREGROUND LAYER — flat vector mark: coiled cable + scope pulse.
       Glass (specular / translucency / shadow) is added by Icon Composer, not baked in. -->
  <g id="foreground">
    <!-- Coiled cable: 290° ring, open on the right where the pulse exits -->
    <path d="M 679.1 629.0 A 204 204 0 1 1 679.1 395.0"
          fill="none" stroke="url(#cable-gradient)"
          stroke-width="80" stroke-linecap="round"/>
    <!-- Oscilloscope pulse traveling through the coil -->
    <path d="M 298 512 H 434 C 474 512 474 388 512 388 C 550 388 550 512 590 512 H 760"
          fill="none" stroke="#FFFFFF"
          stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
