# 构建、打包并把产物发布到已存在的 GitHub Release 上。
#
# 名字叫 Publish 而不是 Release，是因为 Release 本身由 release-please 创建
# （连同 tag）；本 workflow 只负责把 DMG 与 CLI 二进制挂上去、并同步 Homebrew tap。
# 仓库里并排站着 "Release Please" 时，叫 Release 极易看错。
name: Publish

on:
  push:
    tags:
      - 'v*'
  # 手动入口，用于补发或重跑：tag 触发的 workflow 用的是 **tag 所指向那个 commit
  # 上的** workflow 文件，所以 release.yml 自身的修复对已存在的旧 tag 永远不生效
  # （v0.2.0 就是这么变成空壳 release 的）。手动触发时 workflow 取自默认分支、
  # 源码取自指定 tag，既能用上最新逻辑，又不必重打或移动 tag。
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.2.0）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, package & publish artifacts
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 手动触发时检出指定 tag 的源码；tag 触发时就是该 tag 本身
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # tag v0.2.0 -> 版本号 0.2.0（写入 App Info.plist 与 DMG 文件名）。
      # 手动触发时 GITHUB_REF_NAME 是分支名，所以要优先取 inputs.tag。
      - name: Derive version from tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          case "$TAG" in
            v*) ;;
            *) echo "::error::tag 必须以 v 开头，收到的是 '${TAG}'"; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing CableScope ${VERSION} (tag ${TAG})"

      - name: Swift release build
        run: swift build -c release

      # bundle_app.sh 产出 build/CableScope.app；
      # APP_VERSION 注入 Info.plist；CODESIGN_IDENTITY 来自 secrets，
      # 缺失时脚本跳过签名，产出未签名 bundle（不失败）。
      - name: Bundle app (sign only when certificate secret present)
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          if [[ -n "${DEVELOPER_ID_APPLICATION:-}" ]]; then
            export CODESIGN_IDENTITY="${DEVELOPER_ID_APPLICATION}"
            echo "检测到 DEVELOPER_ID_APPLICATION，将对 App 进行 Developer ID 签名。"
          else
            echo "::notice::缺少 DEVELOPER_ID_APPLICATION secret，跳过签名，产出未签名 App。"
          fi
          ./scripts/bundle_app.sh release

      # 始终打 DMG（无论是否签名），供无证书环境也能发布产物
      - name: Create DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          DMG="build/CableScope-${VERSION}.dmg"
          rm -rf build/dmg-staging
          mkdir -p build/dmg-staging
          ditto "build/CableScope.app" "build/dmg-staging/CableScope.app"
          hdiutil create -volname "CableScope ${VERSION}" \
            -srcfolder build/dmg-staging -ov -format UDZO "$DMG"
          echo "DMG_PATH=${DMG}" >> "$GITHUB_ENV"
          echo "已生成 ${DMG}"

      # 公证需要全部 4 个 secrets；任一缺失则跳过并提示，不让流水线失败
      - name: Notarize DMG (skipped when secrets absent)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "NOTARIZED=false" >> "$GITHUB_ENV"
          if [[ -z "${APPLE_ID:-}" || -z "${APPLE_TEAM_ID:-}" || -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" || -z "${DEVELOPER_ID_APPLICATION:-}" ]]; then
            echo "::notice::公证 secrets 缺失（APPLE_ID / APPLE_TEAM_ID / APPLE_APP_SPECIFIC_PASSWORD / DEVELOPER_ID_APPLICATION），跳过签名与公证，发布未公证 DMG。"
            exit 0
          fi
          set -euo pipefail
          DMG="build/CableScope-${VERSION}.dmg"

          # App 已在 bundle 步骤完成 Developer ID + hardened runtime 签名；
          # DMG 内的 App 签名不变，直接对 DMG 公证。
          echo "提交公证（notarytool，等待完成）…"
          xcrun notarytool submit "$DMG" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --wait

          echo "装订公证票据（stapler）…"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "NOTARIZED=true" >> "$GITHUB_ENV"
          echo "公证完成。"

      # 正常路径下 GitHub Release 已由 release-please 在打 tag 时一并创建（release notes
      # 取自 CHANGELOG.md），这里只往上面挂资产 —— 所以不能用 gh release create，那会因
      # 「已存在」直接失败。tag 是手工推的（补发、重跑）时 Release 不存在，才回落到创建。
      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          DMG="build/CableScope-${VERSION}.dmg"
          test -f "$DMG"
          test -f ".build/release/CableScopeCLI"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在（release-please 创建），上传资产。"
            gh release upload "$TAG" --clobber \
              "$DMG" \
              ".build/release/CableScopeCLI"
          else
            echo "::notice::Release ${TAG} 不存在（tag 可能是手工推送的），改为直接创建。"
            gh release create "$TAG" \
              --title "CableScope ${TAG}" \
              --generate-notes \
              "$DMG" \
              ".build/release/CableScopeCLI"
          fi
          echo "已上传 ${DMG} 与 CableScopeCLI 二进制。"

          # 未公证时在 Release 正文里追加一条提示：用户下载后会被 Gatekeeper 拦，
          # 这件事必须在下载页就看得见，而不是装完才发现。
          # 幂等：靠 HTML 注释 marker 防止手动重跑时重复追加。
          if [[ "${NOTARIZED:-false}" != "true" ]]; then
            MARKER="<!-- cablescope:unnotarized -->"
            BODY="$(gh release view "$TAG" --json body --jq .body)"
            if printf '%s' "$BODY" | grep -qF "$MARKER"; then
              echo "Release ${TAG} 正文已有未公证提示，跳过。"
            else
              # printf 的格式串用单引号：正文里含反引号，双引号下会被当成命令替换执行。
              NOTE="$(printf '\n\n%s\n> **This DMG is not notarized.** macOS will refuse to open it on first launch - allow it under System Settings > Privacy & Security > "Open Anyway". Or install the command-line version with `brew install tzzs/tap/cablescope-cli`, which builds from source and needs no signing.\n>\n> **此 DMG 未经 Apple 公证。** 首次打开会被 macOS 拦下，请在「系统设置 - 隐私与安全性」中点「仍要打开」。或改用 `brew install tzzs/tap/cablescope-cli` 安装命令行版本，它从源码构建、无需签名。' "$MARKER")"
              gh release edit "$TAG" --notes "${BODY}${NOTE}"
              echo "已在 Release ${TAG} 正文追加未公证提示。"
            fi
          fi

      # 把 Homebrew 包同步到独立 tap 仓库 tzzs/homebrew-tap。两个包对应两个产品，
      # 同步条件不同：
      #   Formula/cablescope-cli.rb  CLI —— 在用户机器上从源码编译，产物不带
      #                              quarantine、不需要签名，所以**总是**同步。
      #   Casks/cablescope.rb        App —— 分发预编译 DMG，cask 装未公证 App 会被
      #                              Gatekeeper 拦下，所以**仅在公证成功时**同步；
      #                              否则宁可让 tap 停在上一个可用版本。
      # 需要 HOMEBREW_TAP_TOKEN（对该 tap 仓库有 contents:write 权限的 PAT）；
      # 缺失时跳过，不让整个发布流水线失败。
      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "::notice::缺少 HOMEBREW_TAP_TOKEN secret，跳过同步 Homebrew tap。"
            exit 0
          fi
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"

          # 手动补发旧 tag 时不能动 tap：Homebrew 包永远应该指向最新版本，
          # 把 tap 同步到一个更老的 tag 等于给所有用户降级。
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            LATEST="$(gh release view --json tagName --jq .tagName)"
            if [[ "$TAG" != "$LATEST" ]]; then
              echo "::notice::手动补发的 ${TAG} 不是最新 release（${LATEST}），跳过同步 Homebrew tap，避免把 tap 降级。产物仍已挂到 ${TAG} 上。"
              exit 0
            fi
          fi

          rm -rf /tmp/homebrew-tap
          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/tzzs/homebrew-tap.git" \
            /tmp/homebrew-tap

          # --- formula（CLI）---
          # 哈希取 GitHub 按 tag 自动生成的源码 tarball，与签名/公证无关。
          # formula 不写 version stanza：Homebrew 从 tag URL 自行推导版本号。
          #
          # 模板是随源码一起检出的，补发旧 tag 时可能还不存在（formula 是后加的）。
          if [[ -f Packaging/homebrew/cablescope-cli.rb ]]; then
            TARBALL_URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
            curl -fsSL "$TARBALL_URL" -o /tmp/cablescope-src.tar.gz
            SRC_SHA256="$(shasum -a 256 /tmp/cablescope-src.tar.gz | awk '{print $1}')"

            mkdir -p /tmp/homebrew-tap/Formula
            FORMULA=/tmp/homebrew-tap/Formula/cablescope-cli.rb
            cp Packaging/homebrew/cablescope-cli.rb "$FORMULA"
            sed -i '' "s|^  url \".*\"|  url \"${TARBALL_URL}\"|" "$FORMULA"
            sed -i '' "s|^  sha256 \".*\"|  sha256 \"${SRC_SHA256}\"|" "$FORMULA"
            echo "formula 已更新到 ${TAG}（源码 sha256=${SRC_SHA256}）"
          else
            echo "::notice::${TAG} 的源码中没有 formula 模板，跳过 formula 同步。"
          fi

          # --- cask（App）---
          if [[ "${NOTARIZED:-false}" == "true" ]]; then
            DMG="build/CableScope-${VERSION}.dmg"
            DMG_SHA256="$(shasum -a 256 "$DMG" | awk '{print $1}')"
            mkdir -p /tmp/homebrew-tap/Casks
            CASK=/tmp/homebrew-tap/Casks/cablescope.rb
            cp Packaging/homebrew/cablescope.rb "$CASK"
            sed -i '' "s/version \".*\"/version \"${VERSION}\"/" "$CASK"
            sed -i '' "s/sha256 .*/sha256 \"${DMG_SHA256}\"/" "$CASK"
            echo "cask 已更新到 v${VERSION}（DMG sha256=${DMG_SHA256}）"
          else
            echo "::warning::本次 DMG 未经公证，跳过更新 cask（装未公证 App 会被 Gatekeeper 拦下）。DMG 仍挂在 GitHub Release 上；CLI 的 formula 不依赖签名，同步与否见上面的 formula 日志。"
          fi

          cd /tmp/homebrew-tap
          git config user.name "cablescope-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "tap 无变化，跳过提交。"
          else
            git commit -m "chore: bump cablescope to ${TAG}"
            git push
            echo "已推送 tzzs/homebrew-tap。"
          fi
